apiVersion: apps/v1
kind: Deployment
metadata:
  name: canesense-ai
  namespace: canesense
  labels:
    app: canesense-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canesense-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: canesense-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: canesense-ai
          # Local clusters (minikube/kind): load the image, keep IfNotPresent.
          # Registry: replace with <dockerhub-user>/canesense-ai:1.0
          image: canesense-ai:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: canesense-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
