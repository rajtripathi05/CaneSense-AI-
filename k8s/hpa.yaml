# Optional (needs metrics-server): kubectl apply -f k8s/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canesense-ai
  namespace: canesense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canesense-ai
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
