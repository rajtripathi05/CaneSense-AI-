apiVersion: v1
kind: Service
metadata:
  name: canesense-ai
  namespace: canesense
  labels:
    app: canesense-ai
spec:
  type: ClusterIP          # use: kubectl port-forward, or change to NodePort/LoadBalancer
  selector:
    app: canesense-ai
  ports:
    - name: http
      port: 80
      targetPort: http
